name: playmu
version: 0.1.0
summary: playmu
description: playmu

confinement: strict
base: core22
grade: stable

slots:
  dbus-playmu: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.example.playmu # adjust accordingly to your app name

apps:
  playmu:
    command: playmu
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-playmu
parts:
  playmu:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
